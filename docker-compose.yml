services:
  postgres:
    image: postgres:15-alpine
    container_name: film-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    networks:
      - film-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: film-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - film-network
    depends_on:
      - postgres

  backend:
    image: ghcr.io/dmitrychesnov/film-react-nest-backend:latest
    container_name: film-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    ports:
      - "3000:3000"
    networks:
      - film-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/afisha/films"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/dmitrychesnov/film-react-nest-frontend:latest
    container_name: film-frontend
    ports:
      - "3001:80"
    networks:
      - film-network

networks:
  film-network:
    driver: bridge
    name: film-network

volumes:
  postgres_data:
    name: film-postgres-data
  pgadmin_data:
    name: film-pgadmin-data

