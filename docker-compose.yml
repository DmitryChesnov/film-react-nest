services:
  postgres:
    image: postgres:15-alpine
    container_name: film-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - film-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: film-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - film-network
    depends_on:
      - postgres

  backend:
    image: ghcr.io/dmitrychesnov/film-react-nest-backend:latest
    container_name: film-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    ports:
      - "3000:3000"
    networks:
      - film-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/afisha/films"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend-builder:
    image: ghcr.io/dmitrychesnov/film-react-nest-frontend:latest
    container_name: film-frontend-builder
    volumes:
      - frontend_dist:/app/dist
    networks:
      - film-network
    profiles:
      - build

  nginx:
    image: nginx:alpine
    container_name: film-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - film-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  film-network:
    driver: bridge
    name: film-network

volumes:
  postgres_data:
    name: film-postgres-data
  pgadmin_data:
    name: film-pgadmin-data
  frontend_dist:
    name: film-frontend-dist